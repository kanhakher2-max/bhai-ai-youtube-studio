kind = "web"
previewPath = "/"
title = "BHAI AI YouTube Studio"
description = "A single-owner Hindi and Hinglish production studio with local Ollama story generation, scene planning, FFmpeg MP4 rendering, optional ComfyUI still/video workflows, Piper narration, local soundtrack mixing, thumbnail downloads, and owner-approved YouTube uploads when configured."
version = "1.0.0"
id = "artifacts/youtube-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20994

[services.development]
run = "pnpm --filter @workspace/youtube-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/youtube-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/youtube-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20994"
BASE_PATH = "/"
